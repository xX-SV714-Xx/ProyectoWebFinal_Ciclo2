<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title th:text="${titulo}">Listado de Concesionarios</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>

<body>
	<div class="container mt-5">

		<h1 th:text="${titulo}">Listado de Concesionarios</h1>
		<hr>

		<a th:href="@{/concesionarios/nueva}" class="btn btn-success mb-3">
			<i class="fas fa-plus"></i> Registrar Nuevo Concesionario
		</a>

		<table class="table table-striped table-bordered table-hover">
		    <thead class="thead-dark">
		        <tr>
		            <th>ID</th>
		            <th>Distrito</th>
		            <th>Dirección</th>
		            <th>Marca</th> <th>Horarios</th>
		            <th>Acciones</th>
		        </tr>
		    </thead>
		    <tbody>
		        <tr th:each="conc : ${listaConcesionarios}">
		            <td th:text="${conc.id_concesionario}">1</td>
		            <td th:text="${conc.distrito}">distrito</td>
		            <td th:text="${conc.direccion}">Av. Central 456</td>

		            <td th:text="${conc.marca.nombre}">Nombre de la Marca</td> 

		            <td>
		                <a th:href="@{'/horarios/listado/' + ${conc.id_concesionario}}" class="btn btn-sm btn-info"
		                    title="Gestionar Horarios">
		                    <i class="fas fa-clock"></i> Horarios
		                </a>
		            </td>
		            
		            <td>
		                <a th:href="@{/concesionarios/editar/__${conc.id_concesionario}__}" 
		                    class="btn btn-sm btn-warning" title="Editar Concesionario">
		                    <i class="fas fa-edit"></i>
		                </a>

		                <a th:href="@{/concesionarios/eliminar/__${conc.id_concesionario}__}" 
		                    class="btn btn-sm btn-danger" title="Eliminar Concesionario" 
		                    onclick="return confirm('¿Estás seguro de eliminar este concesionario?');">
		                    <i class="fas fa-trash"></i>
		                </a>
		            </td>
		        </tr>
		    </tbody>
		</table>

		<a th:href="@{/}" class="btn btn-secondary mt-3">Volver al Dashboard</a>
	</div>
</body>

</html>
