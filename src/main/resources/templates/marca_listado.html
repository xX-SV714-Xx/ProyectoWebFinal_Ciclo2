<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Listado de Marcas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <div class="container mt-5">
        
        <h1 th:text="${titulo}">Listado de Marcas de Vehículos</h1>
        <hr>
        
        <a th:href="@{/marcas/nuevo}" class="btn btn-success mb-3">
            <i class="fas fa-plus"></i> Registrar Nueva Marca
        </a>

        <table class="table table-striped table-bordered table-hover">
            <thead class="thead-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre de la Marca</th>
                    <th>País de Procedencia</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="marca : ${listaMarcas}">
                    <td th:text="${marca.id_marca}">1</td>
                    <td th:text="${marca.nombre}">Toyota</td> 
                    <td th:text="${marca.pais_de_proveniencia}">Japón</td>
                    <td>
                        <a href="#" class="btn btn-sm btn-warning" title="Editar Marca">
                            <i class="fas fa-edit"></i> Editar
                        </a>
                        
                        <a href="#" class="btn btn-sm btn-danger" title="Eliminar Marca">
                            <i class="fas fa-trash"></i> Eliminar
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <a th:href="@{/}" class="btn btn-secondary mt-3">Volver al Dashboard</a>
    </div>
</body>
</html>
