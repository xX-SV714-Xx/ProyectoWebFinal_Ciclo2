<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Listado de Clientes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <div class="container mt-5">
        
        <h1 th:text="${titulo}">Listado de Clientes (Usuarios)</h1>
        <hr>
        
        <a th:href="@{/clientes/nuevo}" class="btn btn-success mb-3">
            <i class="fas fa-plus"></i> Registrar Nuevo Cliente
        </a>

        <table class="table table-striped table-bordered table-hover">
            <thead class="thead-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombres</th>
                    <th>Apellidos</th>
                    <th>Email</th>
                    <th>Teléfono</th>
                    <th>Dirección</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
				<tr th:each="usuario : ${listaUsuarios}">
                    <td th:text="${usuario.id_cliente}"></td>
                    <td th:text="${usuario.nombres}"></td> 
                    <td th:text="${usuario.apellidos}"></td>
                    <td th:text="${usuario.email}"></td>
                    <td th:text="${usuario.telefono}"></td>
                    <td th:text="${usuario.direccion}"></td>
                    <td>
                        <a href="#" class="btn btn-sm btn-warning" title="Editar Cliente">
                            <i class="fas fa-edit"></i> Editar
                        </a>
                        
                        <a href="#" class="btn btn-sm btn-danger" title="Eliminar Cliente">
                            <i class="fas fa-trash"></i> Eliminar
                        </a>
                     </tr>
                </tr>
            </tbody>
        </table>
        
        <a th:href="@{/}" class="btn btn-secondary mt-3">Volver al Dashboard</a>
    </div>
</body>
</html>
