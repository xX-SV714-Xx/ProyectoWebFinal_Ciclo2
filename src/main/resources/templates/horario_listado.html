<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <h2 class="mt-4" th:text="${titulo}">Horarios de Concesionario</h2>
    
    <a th:href="@{/concesionarios/listado}" class="btn btn-primary mb-3">
        ← Volver al Listado de Concesionarios
    </a>

    <div th:if="${listaHorarios.empty}" class="alert alert-info">
        Este concesionario aún no tiene horarios registrados.
    </div>
    
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>Tipo de Horario</th>
                <th>Días Cubiertos</th>
                <th>Apertura</th>
                <th>Cierre</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>**REGULAR**</td>
                <td>Lunes a Sábado</td>
                <td th:text="${horarioRegular != null} ? ${horarioRegular.horas_apertura} : '8:00AM'"></td>
                <td th:text="${horarioRegular != null} ? ${horarioRegular.hora_cierre} : '5:00PM'"></td>
               
            </tr>

            <tr>
                <td>**DOMINGOS / FERIADOS**</td>
                <td>Domingos y Feriados</td>
                <td th:text="${horarioFeriado != null} ? ${horarioFeriado.horas_apertura} : '10:00AM'"></td>
                <td th:text="${horarioFeriado != null} ? ${horarioFeriado.hora_cierre} : '3:00PM'"></td>
            
            </tr>

        </tbody>
    </table>
    
</div>
</body>
</html>
