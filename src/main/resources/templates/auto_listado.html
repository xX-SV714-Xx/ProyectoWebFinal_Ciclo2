<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Autos - Inventario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <div class="container mt-5">
        
        <h1>Inventario de Vehículos</h1>
        <hr>
        
        <a th:href="@{/autos/nuevo}" class="btn btn-success mb-3">
            <i class="fas fa-plus"></i> Registrar Nuevo Auto
        </a>

        <table class="table table-striped table-bordered table-hover">
            <thead class="thead-dark">
                <tr>
                    <th>ID</th>
                    <th>Marca</th>
                    <th>Modelo</th>
                    <th>Matrícula</th>
                    <th>Precio</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
				
                <tr th:each="auto : ${listaAutos}">
                    <td th:text="${auto.id}">1</td>
                    <td th:text="${auto.marca.nombre}">Toyota</td> 
                    <td th:text="${auto.modelo}">Corolla</td>
                    <td th:text="${auto.matricula}">ABC123</td>
                    <td th:text="'S/ ' + ${#numbers.formatDecimal(auto.precio, 0, 'COMMA', 2, 'POINT')}">S/ 25,000.00</td>
					<td>
						<a th:href="@{/autos/detalles/{id_auto}(id_auto=${auto.id})}" 
						   class="btn btn-sm btn-info" title="Detalle">
						    <i class="fas fa-search"></i> Detalle
						</a>
                        
                        <a href="#" class="btn btn-sm btn-warning" title="Editar Auto">
                            <i class="fas fa-edit"></i>
                        </a>
                        
                        <a href="#" class="btn btn-sm btn-danger" title="Eliminar Auto">
                            <i class="fas fa-trash"></i>
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <a th:href="@{/}" class="btn btn-secondary mt-3">Volver al Inicio</a>
    </div>
</body>
</html>
