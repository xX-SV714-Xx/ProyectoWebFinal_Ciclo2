<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} ?: 'Formulario de Cliente'"></title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" th:href="@{/}">Sistema de Ventas</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/autos/listado}">Autos</a>
                </li>
                <li class="nav-item active">
                    <a class="nav-link" th:href="@{/clientes/listado}">Clientes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/ventas/listado}">Ventas</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                
                <h2 th:text="${titulo} ?: 'Datos del Cliente'">Formulario de Cliente</h2>
                <hr />

               <form th:action="@{/clientes/guardar}" method="post" th:object="${usuario}">

                    <input type="hidden" th:field="*{id_cliente}" />

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="nombres">Nombres</label>
                            <input type="text" class="form-control" th:field="*{nombres}" id="nombres" placeholder="Ej: Juan" required>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="apellidos">Apellidos</label>
                            <input type="text" class="form-control" th:field="*{apellidos}" id="apellidos" placeholder="Ej: Pérez" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-8">
                            <label for="email">Email</label>
                            <input type="email" class="form-control" th:field="*{email}" id="email" placeholder="ejemplo@correo.com" required>
                        </div>
                        <div class="form-group col-md-4">
                            <label for="telefono">Teléfono</label>
                            <input type="text" class="form-control" th:field="*{telefono}" id="telefono" placeholder="Ej: 987654321" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="direccion">Dirección</label>
                        <input type="text" class="form-control" th:field="*{direccion}" id="direccion" placeholder="Av. Siempre Viva 123" required>
                    </div>

                    <hr>
					<div class="form-group">
					        <button type="submit" class="btn btn-success my-3">
					            <i class="fas fa-save"></i> Guardar Cliente
					        </button>
					        
					        <a th:href="@{/clientes/listado}" class="btn btn-info my-3">
					            <i class="fas fa-list"></i> Volver al Listado
					        </a>
					    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>
</body>
</html>
