<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Listado de Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container { padding-top: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <h2 th:text="${titulo}">Historial de Ventas</h2>

        <a th:href="@{/ventas/nueva}" class="btn btn-success mb-3">Registrar Nueva Venta</a>

        <div th:if="${error}" class="alert alert-danger" role="alert">
            <span th:text="${error}"></span>
        </div>

        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>ID Venta</th> 
                    <th>Fecha</th>
                    <th>Cliente</th>
                    <th>Auto (Matrícula)</th>
                    <th>Precio Final</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="v : ${listaVentas}">
                    <td th:text="${v.idVenta}">1</td> 
                    <td th:text="${v.fechaVenta}">2025-10-29</td>
                    
                    <td th:text="${v.cliente.nombres} + ' ' + ${v.cliente.apellidos}">Nombre Cliente</td>
                    <td th:text="${v.auto.matricula}">ABC78</td>
                    
                    <td th:text="'S/ ' + ${#numbers.formatDecimal(v.precioFinal, 0, 'COMMA', 2, 'POINT')}">S/ 50,000.00</td>
                    <td th:text="${v.estado}">Finalizada</td>
                    
                    <td>
                        <a th:href="@{/ventas/detalle/{id}(id=${v.idVenta})}" class="btn btn-info btn-sm">Detalle</a>
                        <a th:href="@{/ventas/editar/{id}(id=${v.idVenta})}" class="btn btn-warning btn-sm">Editar</a>
                        <a th:href="@{/ventas/eliminar/{id}(id=${v.idVenta})}" class="btn btn-danger btn-sm">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>

        <a th:href="@{/}" class="btn btn-secondary">Volver al Inicio</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
