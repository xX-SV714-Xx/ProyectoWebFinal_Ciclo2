
	<!DOCTYPE html>
	<html lang="es" xmlns:th="http://www.thymeleaf.org">
	<head>
	    <meta charset="UTF-8">
	    <title th:text="${titulo}"></title>
	    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	    <style>
	        .container { margin-top: 20px; }
	        .card { margin-bottom: 20px; }
	    </style>
	</head>
	<body>

	<div class="container">
	    <div class="row">
	        <div class="col-md-8 offset-md-2">
	            <h2 class="text-center" th:text="${titulo}"></h2>
	            
	            <div class="card">
	                <div class="card-header bg-primary text-white">
	                    Datos del Horario para el Concesionario: 
	                    <span th:text="${concesionario.distrito}">[Distrito]</span>
	                </div>
	                <div class="card-body">
	                    
	                    <form th:action="@{/horarios/guardar}" th:object="${horario}" method="post">
	                        
	                        <input type="hidden" th:field="*{idHorario}">
	                        <input type="hidden" th:field="*{concesionario.id_concesionario}">


	                        <div class="mb-3">
	                            <label for="tipoHorario" class="form-label">Tipo de Horario:</label>
	                            <select id="tipoHorario" th:field="*{diaSemana}" class="form-select" required>
	                                <option value="">-- Seleccionar Tipo --</option>
	                                <option value="Regular">Lunes a Sábado (Regular)</option>
	                                <option value="Feriado">Domingos y Feriados</option>
	                            </select>
	                        </div>
	                        
	                        <div class="mb-3">
	                            <label for="horaApertura" class="form-label">Hora de Apertura:</label>
	                            <select id="horaApertura" th:field="*{horaApertura}" class="form-select" required>
	                                <option value="">-- Seleccionar Hora --</option>
	                                <option value="09:00">09:00 AM (Regular)</option>
	                                <option value="10:00">10:00 AM (Domingos/Feriados)</option>
	                            </select>
	                        </div>

	                        <div class="mb-3">
	                            <label for="horaCierre" class="form-label">Hora de Cierre:</label>
	                            <select id="horaCierre" th:field="*{horaCierre}" class="form-select" required>
	                                <option value="">-- Seleccionar Hora --</option>
	                                <option value="17:00">05:00 PM (Regular)</option>
	                                <option value="15:00">03:00 PM (Domingos/Feriados)</option>
	                            </select>
	                        </div>

	                        <hr>
	                        
	                        <div class="d-flex justify-content-between">
	                            <button type="submit" class="btn btn-success">Guardar Horario</button>
	                            <a th:href="@{/horarios/listado/{id}(id=${concesionario.id_concesionario})}" class="btn btn-secondary">Cancelar</a>
	                        </div>
	                    </form>
	                </div>
	            </div>
	        </div>
	    </div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	</body>
	</html>
