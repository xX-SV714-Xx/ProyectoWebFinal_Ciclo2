<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalles del Auto</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        
        <h1 class="mb-4">Detalles del Vehículo</h1>
        <hr>

		<div th:if="${auto != null}">
		    
		    <h2>Datos del Vehículo</h2>
		    <p>ID: <span th:text="${auto.id}"></span></p>
		    <p>Modelo: <span th:text="${auto.modelo}"></span></p>
		    <p>Matrícula: <span th:text="${auto.matricula}"></span></p>
		    <p>Precio: <span th:text="${auto.precio}"></span></p>
		    
		    <hr>
		    
		    <h3>Especificaciones Técnicas</h3>
		    
		    <p>Velocidad Punta: 
		        <span th:text="${auto.especificacion.velocidadPunta}"></span> km/h
		    </p>
		    <p>Caballos de Fuerza: 
		        <span th:text="${auto.especificacion.caballosDeFuerza}"></span> CV
		    </p>
		    <p>Capacidad de Asientos: 
		        <span th:text="${auto.especificacion.capacidadAsientos}"></span>
		    </p>
		    <p>Color: 
		        <span th:text="${auto.especificacion.color}"></span>
		    </p>
		    <p>Tipo de Motor: 
		        <span th:text="${auto.especificacion.tipoMotor}"></span>
		    </p>
		    
		</div>
        
        <div th:unless="${auto != null}" class="alert alert-danger">
            No se encontró el vehículo.
        </div>

        <a th:href="@{/autos/listado}" class="btn btn-secondary mt-3">Volver al Inventario</a>
    </div>
</body>
</html>
